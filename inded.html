<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kids Routine Tracker</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        h1 { margin: 0 0 10px 0; color: #2c3e50; text-align: center; font-size: 1.8rem; }
        .top-bar {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .admin-btn {
            background: #7f8c8d;
            border: none;
            padding: 8px 15px;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .day-selector {
            margin-bottom: 20px;
            display: flex;
            overflow-x: auto;
            max-width: 100%;
            padding-bottom: 5px;
            width: 100%;
            max-width: 600px;
            justify-content: center;
        }
        .day-btn {
            background: #fff;
            border: 2px solid #3498db;
            padding: 8px 12px;
            margin: 0 3px;
            font-size: 0.95rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            color: #3498db;
            white-space: nowrap;
        }
        .day-btn.active {
            background: #3498db;
            color: white;
        }
        .card {
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 600px;
            text-align: center;
        }
        .task-icon { font-size: 3.5rem; margin-bottom: 5px; }
        .task-title { font-size: 1.8rem; margin-bottom: 15px; color: #2c3e50; }
        .subtasks {
            text-align: left;
            margin: 15px 0;
            font-size: 1.3rem;
        }
        .subtask-item {
            display: flex;
            align-items: center;
            padding: 10px;
            margin: 8px 0;
            background: #f8f9fa;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .subtask-item.completed {
            background: #e8f8f5;
            text-decoration: line-through;
            color: #7f8c8d;
        }
        input[type="checkbox"] {
            width: 24px;
            height: 24px;
            margin-right: 15px;
            cursor: pointer;
        }
        
        /* Circular Visual Timer */
        .timer-container {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .timer-display {
            font-size: 2.2rem;
            font-weight: bold;
            color: #e74c3c;
            margin: 10px 0;
        }
        .timer-controls button {
            background: #3498db;
            color: white;
            border: none;
            padding: 8px 16px;
            margin: 0 5px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
        }
        .timer-controls button.reset-btn { background: #95a5a6; }

        /* Admin Modal Styling */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 15px;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            text-align: left;
        }
        .modal-content h2 { margin-top: 0; color: #2c3e50; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; }
        .form-group input, .form-group select {
            width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem;
        }
        .btn { background: #2ecc71; color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-danger { background: #e74c3c; padding: 5px 10px; font-size: 0.85rem; }
        .btn-secondary { background: #95a5a6; }
        .task-list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8f9fa;
            padding: 8px 12px;
            margin-bottom: 8px;
            border-radius: 6px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <h1>🌟 Daily Mission Control 🌟</h1>
        <button class="admin-btn" onclick="openAdmin()">⚙️ Parent Mode</button>
    </div>
    
    <div class="day-selector" id="daySelector">
        <button class="day-btn" data-day="Monday" onclick="selectDay('Monday')">Mon</button>
        <button class="day-btn" data-day="Tuesday" onclick="selectDay('Tuesday')">Tue</button>
        <button class="day-btn" data-day="Wednesday" onclick="selectDay('Wednesday')">Wed</button>
        <button class="day-btn" data-day="Thursday" onclick="selectDay('Thursday')">Thu</button>
        <button class="day-btn" data-day="Friday" onclick="selectDay('Friday')">Fri</button>
        <button class="day-btn" data-day="Saturday" onclick="selectDay('Saturday')">Sat</button>
        <button class="day-btn" data-day="Sunday" onclick="selectDay('Sunday')">Sun</button>
    </div>

    <div class="card" id="appCard">
        <div class="task-icon" id="taskIcon">⏳</div>
        <div class="task-title" id="taskCategory">Loading tasks...</div>
        <div class="subtasks" id="subtaskList"></div>
        
        <!-- Timer Controls -->
        <div class="timer-container">
            <div class="timer-display" id="timerDisplay">⏱️ 05:00</div>
            <div class="timer-controls">
                <button id="startTimerBtn" onclick="toggleTimer()">▶️ Start</button>
                <button class="reset-btn" onclick="resetTimer()">🔄 Reset</button>
            </div>
        </div>
    </div>

    <!-- Parent Admin Modal -->
    <div class="modal" id="adminModal">
        <div class="modal-content">
            <h2>Parent Admin Portal</h2>
            <hr style="margin-bottom: 20px;">
            
            <h3>Add New Task</h3>
            <form id="addTaskForm" onsubmit="addNewTask(event)">
                <div class="form-group">
                    <label>Day</label>
                    <select id="addTaskDay">
                        <option value="Monday">Monday</option>
                        <option value="Tuesday">Tuesday</option>
                        <option value="Wednesday">Wednesday</option>
                        <option value="Thursday">Thursday</option>
                        <option value="Friday">Friday</option>
                        <option value="Saturday">Saturday</option>
                        <option value="Sunday">Sunday</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Category (e.g., Morning Routine)</label>
                    <input type="text" id="addTaskCategory" required placeholder="Morning Routine">
                </div>
                <div class="form-group">
                    <label>Subtask (e.g., Brush Teeth)</label>
                    <input type="text" id="addTaskSubtask" required placeholder="Brush Teeth">
                </div>
                <div class="form-group">
                    <label>Icon / Emoji</label>
                    <input type="text" id="addTaskIcon" value="🪥" required style="width: 80px;">
                </div>
                <button type="submit" class="btn">Add Task</button>
            </form>

            <h3 style="margin-top: 25px;">Manage Existing Tasks</h3>
            <div id="adminTaskList" style="max-height: 200px; overflow-y: auto; margin-bottom: 20px;"></div>

            <button type="button" class="btn btn-secondary" onclick="closeAdmin()">Close Parent Mode</button>
        </div>
    </div>

    <script>
        const daysOfWeek = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
        
        // Auto-detect current day of week
        const todayIndex = new Date().getDay();
        let currentDay = daysOfWeek[todayIndex];

        const defaultRoutineData = [
            { id: 1, Day: 'Monday', Category: 'Morning Routine', Subtask: 'Make Bed', Icon: '🛏️' },
            { id: 2, Day: 'Monday', Category: 'Morning Routine', Subtask: 'Brush Teeth', Icon: '🪥' },
            { id: 3, Day: 'Tuesday', Category: 'Morning Routine', Subtask: 'Make Bed', Icon: '🛏️' },
            { id: 4, Day: 'Wednesday', Category: 'Morning Routine', Subtask: 'Brush Teeth', Icon: '🪥' },
            { id: 5, Day: 'Thursday', Category: 'Morning Routine', Subtask: 'Get Dressed', Icon: '👕' },
            { id: 6, Day: 'Thursday', Category: 'Morning Routine', Subtask: 'Brush Teeth', Icon: '🪥' },
            { id: 7, Day: 'Friday', Category: 'Morning Routine', Subtask: 'Make Bed', Icon: '🛏️' },
            { id: 8, Day: 'Saturday', Category: 'Morning Routine', Subtask: 'Clean Room', Icon: '🧹' },
            { id: 9, Day: 'Sunday', Category: 'Morning Routine', Subtask: 'Read Book', Icon: '📚' }
        ];

        let routineData = JSON.parse(localStorage.getItem('kidsRoutineData')) || defaultRoutineData;
        let checkedStates = JSON.parse(localStorage.getItem('kidsCheckedStates')) || {};

        // Timer Variables
        const DEFAULT_TIME = 300; // 5 minutes in seconds
        let timeLeft = DEFAULT_TIME;
        let timerInterval = null;

        function selectDay(day) {
            currentDay = day;
            document.querySelectorAll('.day-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.day === currentDay);
            });
            resetTimer();
            renderRoutine();
        }

        function renderRoutine() {
            const filtered = routineData.filter(item => item.Day.toLowerCase() === currentDay.toLowerCase());
            
            if (filtered.length === 0) {
                document.getElementById('taskIcon').innerText = '🌴';
                document.getElementById('taskCategory').innerText = `No tasks for ${currentDay}`;
                document.getElementById('subtaskList').innerHTML = '<p style="color: #7f8c8d; text-align: center;">Tap "Parent Mode" to add tasks for today!</p>';
                return;
            }

            const currentTask = filtered[0];
            document.getElementById('taskIcon').innerText = currentTask.Icon || '📌';
            document.getElementById('taskCategory').innerText = currentTask.Category;

            let html = '';
            filtered.forEach((item) => {
                const isChecked = checkedStates[item.id] ? 'checked' : '';
                const completedClass = checkedStates[item.id] ? 'completed' : '';
                html += `
                    <div class="subtask-item ${completedClass}" onclick="toggleCheck(${item.id})">
                        <input type="checkbox" ${isChecked} onclick="event.stopPropagation(); toggleCheck(${item.id})">
                        <span>${item.Subtask}</span>
                    </div>
                `;
            });
            document.getElementById('subtaskList').innerHTML = html;
        }

        function toggleCheck(id) {
            checkedStates[id] = !checkedStates[id];
            localStorage.setItem('kidsCheckedStates', JSON.stringify(checkedStates));
            renderRoutine();
        }

        // Timer Logic
        function updateTimerDisplay() {
            const mins = Math.floor(timeLeft / 60);
            const secs = timeLeft % 60;
            document.getElementById('timerDisplay').innerText = 
                `⏱️ ${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function toggleTimer() {
            const btn = document.getElementById('startTimerBtn');
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
                btn.innerText = '▶️ Start';
            } else {
                timerInterval = setInterval(() => {
                    if (timeLeft > 0) {
                        timeLeft--;
                        updateTimerDisplay();
                    } else {
                        clearInterval(timerInterval);
                        timerInterval = null;
                        btn.innerText = '▶️ Start';
                        alert('🎉 Time is up! Great job!');
                    }
                }, 1000);
                btn.innerText = '⏸️ Pause';
            }
        }

        function resetTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            timeLeft = DEFAULT_TIME;
            document.getElementById('startTimerBtn').innerText = '▶️ Start';
            updateTimerDisplay();
        }

        // Admin Modal Logic
        function openAdmin() {
            const pin = prompt("Enter Parent PIN (default is 1234):");
            if (pin === "1234") {
                document.getElementById('adminModal').style.display = 'flex';
                renderAdminTaskList();
            } else if (pin !== null) {
                alert("Incorrect PIN!");
            }
        }

        function closeAdmin() {
            document.getElementById('adminModal').style.display = 'none';
            renderRoutine();
        }

        function addNewTask(event) {
            event.preventDefault();
            const newItem = {
                id: Date.now(),
                Day: document.getElementById('addTaskDay').value,
                Category: document.getElementById('addTaskCategory').value,
                Subtask: document.getElementById('addTaskSubtask').value,
                Icon: document.getElementById('addTaskIcon').value
            };
            routineData.push(newItem);
            localStorage.setItem('kidsRoutineData', JSON.stringify(routineData));
            document.getElementById('addTaskSubtask').value = '';
            renderAdminTaskList();
        }

        function deleteTask(id) {
            routineData = routineData.filter(item => item.id !== id);
            delete checkedStates[id];
            localStorage.setItem('kidsRoutineData', JSON.stringify(routineData));
            localStorage.setItem('kidsCheckedStates', JSON.stringify(checkedStates));
            renderAdminTaskList();
        }

        function renderAdminTaskList() {
            const container = document.getElementById('adminTaskList');
            if (routineData.length === 0) {
                container.innerHTML = '<p>No tasks saved.</p>';
                return;
            }
            let html = '';
            routineData.forEach((item) => {
                html += `
                    <div class="task-list-item">
                        <span><b>${item.Day}</b> - ${item.Category}: ${item.Subtask} (${item.Icon})</span>
                        <button class="btn btn-danger" onclick="deleteTask(${item.id})">Delete</button>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        // Initialize view
        selectDay(currentDay);
    </script>
</body>
</html>
